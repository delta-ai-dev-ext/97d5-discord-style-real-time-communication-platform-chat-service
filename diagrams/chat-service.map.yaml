relationships:
- id: r-client
  source: client
  target: svc
  type: request
  interaction:
    channel: direct
    purpose: HTTP message API calls
    protocol: HTTP
  evidence:
  - path: docs/architecture.md
    quote: '| HTTP API layer | Request validation, JWT verification, error mapping,
      rate limiting |'
- id: r-access
  source: svc
  target: community
  type: request
  interaction:
    channel: direct
    purpose: per-request channel access decision
    protocol: HTTP
  evidence:
  - path: docs/decisions/ADR-002-fail-closed-access-checks.md
    quote: 'On every send and every history read, call `GET /internal/v1/channels/{channel_id}/access/{user_id}`
      with:'
  - path: docs/architecture.md
    quote: W3C `traceparent` accepted on inbound HTTP, propagated to the `community_service`
      call and stored in outbox payloads (`trace_parent` field) so downstream consumers
      (gateway) can continue traces.
- id: r-db
  source: svc
  target: db
  type: ownership
  evidence:
  - path: docs/architecture.md
    quote: '| Message repository | SQL persistence against the `messages` table |'
- id: r-prod
  source: svc
  target: kafka
  type: event
  direction: forward
  interaction:
    channel: messaging
    purpose: message lifecycle fan-out
    protocol: Kafka
  messaging:
    role: producer
    topic: chat_message_events
  evidence:
  - path: docs/architecture.md
    quote: '| Outbox relay | Publishes committed outbox rows to the `chat_message_events`
      topic with backoff |'
  - path: docs/architecture.md
    quote: '| Kafka produce failure | Outbox row remains unpublished; relay retries
      with backoff. Requests are never blocked on Kafka. |'
- id: r-cons
  source: kafka
  target: svc
  type: event
  direction: forward
  interaction:
    channel: messaging
    purpose: idempotent history purge
    protocol: Kafka
  messaging:
    role: consumer
    topic: community_events
  evidence:
  - path: docs/architecture.md
    quote: '| Community-events consumer | Consumes `community_events`, performs idempotent
      history purges |'
  - path: docs/architecture.md
    quote: '**Scaling**: replicas scale independently; the access check is per-request,
      the outbox relay competes on unpublished rows, and the Kafka consumer group
      rebalances automatically.'
